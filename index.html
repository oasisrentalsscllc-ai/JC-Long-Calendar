<style>
:root{
  --bg:#fefcf7; --ink:#1f1b16; --muted:#8a7c66;
  --avail-bg:#e8f0ef; --avail-ring:#1e4e4e; --avail-ink:#1e4e4e;
  --booked-bg:#efe9dd; --booked-ink:#b3a78f;
  --accent:#1e4e4e; --accent-ink:#ffffff;
  --sel-bg:#dce8e7; --sel-ring:#1e4e4e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Wix Madefor Text","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#jcl-app{max-width:680px;margin:0 auto;padding:20px 16px 28px}
.jcl-head h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;
  font-size:26px;margin:0 0 4px;letter-spacing:-.01em;color:var(--ink)}
.jcl-rate{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.jcl-legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.jcl-dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.jcl-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.jcl-nav button{border:1px solid #ddd2bd;background:#fffdf9;border-radius:2px;width:40px;height:40px;
  font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.jcl-nav button:disabled{opacity:.3;cursor:default}
#jcl-monthLabel{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:18px}
.jcl-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.jcl-dow{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:4px 0}
.jcl-day{aspect-ratio:1/1;border-radius:4px;border:1px solid transparent;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--avail-bg);
  color:var(--avail-ink);font-weight:500;padding:0;font-family:inherit}
.jcl-day:hover{border-color:var(--avail-ring)}
.jcl-day.booked{background:var(--booked-bg);color:var(--booked-ink);cursor:default;text-decoration:line-through}
.jcl-day.booked:hover{border-color:transparent}
.jcl-day.avail-either{box-shadow:inset 0 0 0 1px var(--avail-ring)}
.jcl-day.avail-in{box-shadow:inset 3px 0 0 var(--avail-ring)}
.jcl-day.avail-out{box-shadow:inset -3px 0 0 var(--avail-ring)}
.jcl-day.avail-mid{background:#eef4f3;color:#7d9a97}
.jcl-day.dim{opacity:.45}
.jcl-day.nopick{cursor:default}
.jcl-day.nopick:hover{border-color:transparent}
.jcl-day.past{background:transparent;color:#d8dce1;cursor:default}
.jcl-day.past:hover{border-color:transparent}
.jcl-day.blank{background:transparent;cursor:default}
.jcl-day.sel-start,.jcl-day.sel-end{background:var(--accent);color:var(--accent-ink);font-weight:700}
.jcl-day.in-range{background:var(--sel-bg);border-color:var(--sel-ring);color:var(--ink)}
#jcl-status{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:20px;text-align:center}
#jcl-status.hidden{display:none}
#jcl-bar{margin-top:12px;border:1px solid #e8dfd1;border-radius:2px;padding:12px 14px;display:none;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fffdf9}
#jcl-bar.show{display:flex}
#jcl-summary{font-size:14px}
#jcl-cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:0;padding:12px 28px;
  font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:none;font-family:inherit}
#jcl-cta.show{display:inline-block}
#jcl-clear{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;
  text-decoration:underline;font-family:inherit;padding:10px 4px}

<div id="jcl-app">
  <div class="jcl-head">
    <h1>Vitamin Sea</h1>
    <p class="jcl-rate">Starting at $900/night; rates vary by date and duration.</p>
  </div>
  <div class="jcl-legend">
    <span><span class="jcl-dot" style="background:var(--avail-bg);box-shadow:inset 0 0 0 1px var(--avail-ring)"></span>Check-in or check-out</span>
    <span><span class="jcl-dot" style="background:var(--avail-bg);box-shadow:inset 3px 0 0 var(--avail-ring)"></span>Check-in only</span>
    <span><span class="jcl-dot" style="background:var(--avail-bg);box-shadow:inset -3px 0 0 var(--avail-ring)"></span>Check-out only</span>

    <span><span class="jcl-dot" style="background:var(--booked-bg)"></span>Booked</span>

    <span id="jcl-summary"></span>
    <span>
      <a id="jcl-cta" href="#" target="_top" rel="noopener">Check Rates & Book</a>
      <button id="jcl-clear">Clear</button>
    </span>
  </div>
</div>
<script>
"use strict";
/* Data baked in at build time by publish.py (refreshed 2x/day). */
var BOOKED = {};
BOOKED["2026-10-18"]=1;
BOOKED["2026-10-19"]=1;
BOOKED["2026-10-20"]=1;
BOOKED["2026-10-21"]=1;
BOOKED["2026-10-22"]=1;
BOOKED["2026-10-23"]=1;
BOOKED["2026-11-02"]=1;
BOOKED["2026-11-03"]=1;
BOOKED["2026-11-04"]=1;
BOOKED["2026-11-05"]=1;
BOOKED["2026-11-09"]=1;
BOOKED["2026-11-10"]=1;
BOOKED["2026-11-11"]=1;
BOOKED["2026-11-21"]=1;
BOOKED["2026-11-22"]=1;
BOOKED["2026-11-23"]=1;
BOOKED["2026-11-24"]=1;
BOOKED["2026-11-25"]=1;
BOOKED["2026-11-26"]=1;
BOOKED["2026-11-27"]=1;
BOOKED["2026-12-28"]=1;
BOOKED["2026-12-29"]=1;
BOOKED["2026-12-30"]=1;
BOOKED["2026-12-31"]=1;
BOOKED["2027-01-01"]=1;
BOOKED["2027-02-12"]=1;
BOOKED["2027-02-13"]=1;
BOOKED["2027-02-14"]=1;
BOOKED["2027-02-15"]=1;
BOOKED["2027-02-16"]=1;
BOOKED["2027-02-17"]=1;
BOOKED["2027-02-18"]=1;
BOOKED["2027-02-19"]=1;
BOOKED["2027-02-20"]=1;
BOOKED["2027-02-21"]=1;
BOOKED["2027-02-22"]=1;
BOOKED["2027-02-23"]=1;
BOOKED["2027-02-24"]=1;
BOOKED["2027-02-25"]=1;
BOOKED["2027-02-26"]=1;
BOOKED["2027-03-14"]=1;
BOOKED["2027-03-15"]=1;
BOOKED["2027-03-16"]=1;
BOOKED["2027-03-17"]=1;
BOOKED["2027-03-18"]=1;
BOOKED["2027-04-21"]=1;
BOOKED["2027-04-22"]=1;
BOOKED["2027-04-23"]=1;
BOOKED["2027-04-24"]=1;
BOOKED["2027-07-24"]=1;
BOOKED["2027-07-25"]=1;
BOOKED["2027-07-26"]=1;
BOOKED["2027-07-27"]=1;
BOOKED["2027-07-28"]=1;
BOOKED["2027-07-29"]=1;
BOOKED["2027-07-30"]=1;
var COVER_START = "2026-10-18";
var COVER_END = "2027-10-31";
var INQUIRY = {"type": "url", "url": "https://www.islandrealty.com/rentals/book-now/?propertyID=268&checkin={checkin}&checkout={checkout}", "label": "Check Rates & Book", "date_format": "mdy"}; /* {type:"email",address} | {type:"url",url} | null */
var PROPERTY = "Vitamin Sea";
var GADS = {"conversion_id": "AW-18505762396", "book_click_label": "ZTLiCPbimpgdENyMnvhE", "date_select_label": "s-xnCPHNppgdENyMnvhE"}; /* null until config.json gains a google_ads block */
var FBP = {"pixel_id": "1631241165061482"}; /* null until config.json gains a meta_pixel block */
var CLICKLOG = {"endpoint": "https://vitamin-sea-clicklog.oasis-rentals-sc-llc.workers.dev/log"}; /* null until config.json gains a click_log block */
var RULES = {"min_nights": 3, "relax_within_days": 30, "sat_to_sat_windows": [{"start": "2027-05-29", "end": "2027-08-13"}]}; /* {min_nights, relax_within_days, sat_to_sat_windows:[{start,end}]} */

var MONTHS = ["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
var DOW = ["S","M","T","W","T","F","S"];

var today = new Date(); today.setHours(0,0,0,0);
var viewY = today.getFullYear(), viewM = today.getMonth();
var selStart = null, selEnd = null;

function iso(y,m,d){
  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function parseISO(s){
  var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]);
}
function pretty(s){
  return parseISO(s).toLocaleDateString(undefined,
    {weekday:"short",month:"short",day:"numeric"});
}
function nightsBetween(a,b){
  return Math.round((parseISO(b)-parseISO(a))/86400000);
}
function inBookedRange(a,b){ /* any booked night in [a,b) ? */
  var d=parseISO(a), end=parseISO(b);
  while(d<end){
    if(BOOKED[iso(d.getFullYear(),d.getMonth(),d.getDate())]) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

/* ---- Island Realty booking rules (config.json -> booking_rules) ----
   Year-round minimum stay. Inside a Saturday-to-Saturday window, stays
   must run Saturday to Saturday -- unless arrival is within
   RULES.relax_within_days of today, when the window relaxes to the plain
   minimum stay. Open dates are color-coded by whether a stay can start
   there (check-in), end there (check-out), both, or neither (mid-stay). */
var todayS = iso(today.getFullYear(),today.getMonth(),today.getDate());
function addDays(s,n){
  var d=parseISO(s); d.setDate(d.getDate()+n);
  return iso(d.getFullYear(),d.getMonth(),d.getDate());
}
function minNights(){ return (RULES&&RULES.min_nights)||3; }
function inSatWindow(s){
  if(!RULES||!RULES.sat_to_sat_windows) return false;
  for(var i=0;i<RULES.sat_to_sat_windows.length;i++){
    var w=RULES.sat_to_sat_windows[i];
    if(s>=w.start&&s<=w.end) return true;
  }
  return false;
}
function satOnly(ci){ /* strict Sat-to-Sat applies to a stay arriving on ci */
  if(!inSatWindow(ci)) return false;
  return nightsBetween(todayS,ci) > ((RULES&&RULES.relax_within_days)||30);
}
function isOpenDate(s){ /* selectable date: in coverage, not past, night free */
  return s>=todayS&&s>=COVER_START&&s<=COVER_END&&!BOOKED[s];
}
function validStay(ci,co){
  if(co<=ci||!isOpenDate(ci)||!isOpenDate(co)) return false;
  var n=nightsBetween(ci,co);
  if(satOnly(ci)){
    if(parseISO(ci).getDay()!==6||parseISO(co).getDay()!==6) return false;
    if(n<7) return false;
  }else if(!inSatWindow(ci)&&inSatWindow(co)&&parseISO(co).getDay()!==6
      &&nightsBetween(todayS,co)>((RULES&&RULES.relax_within_days)||30)){
    /* Arrives before the season but departs inside a strict Sat-to-Sat
       window: the departure must land on a Saturday. */
    return false;
  }else if(n<minNights()) return false;
  return !inBookedRange(ci,co);
}
function canCheckIn(s){
  if(!isOpenDate(s)) return false;
  if(satOnly(s)&&parseISO(s).getDay()!==6) return false;
  var strict=satOnly(s), step=strict?7:1, off=strict?7:minNights();
  for(;;off+=step){
    var co=addDays(s,off);
    if(co>COVER_END) return false;
    if(inBookedRange(s,co)) return false;
    if(!BOOKED[co]&&validStay(s,co)) return true;
    /* If the checkout morning is another guest's arrival day, any later
       checkout would span that booked night too -- no valid checkout.
       (An open but rule-invalid candidate just advances the search.) */
    if(BOOKED[co]) return false;
  }
}
function canCheckOut(s){
  if(!isOpenDate(s)) return false;
  var off, ci;
  /* plain / relaxed stays: some arrival >= minNights earlier, same open run */
  for(off=minNights();;off++){
    ci=addDays(s,-off);
    if(ci<todayS||ci<COVER_START) break;
    if(BOOKED[ci]) break;
    if(!satOnly(ci)&&validStay(ci,s)) return true;
  }
  /* Saturday-to-Saturday stays */
  if(parseISO(s).getDay()===6){
    for(off=7;;off+=7){
      ci=addDays(s,-off);
      if(ci<todayS||ci<COVER_START) break;
      if(BOOKED[ci]) break;
      if(validStay(ci,s)) return true;
    }
  }
  return false;
}
function eligClass(s){ /* color-coding class for an open date */
  var i=canCheckIn(s), o=canCheckOut(s);
  if(i&&o) return "avail-either";
  if(i) return "avail-in";
  if(o) return "avail-out";
  return "avail-mid";
}

function render(){
  var label=document.getElementById("jcl-monthLabel");
  var grid=document.getElementById("jcl-grid");
  label.textContent=MONTHS[viewM]+" "+viewY;
  grid.innerHTML="";
  DOW.forEach(function(d){
    var e=document.createElement("div");
    e.className="jcl-dow"; e.textContent=d; grid.appendChild(e);
  });
  var first=new Date(viewY,viewM,1).getDay();
  var dim=new Date(viewY,viewM+1,0).getDate();
  var todayS=iso(today.getFullYear(),today.getMonth(),today.getDate());
  for(var i=0;i<first;i++){
    var b=document.createElement("div"); b.className="jcl-day blank"; grid.appendChild(b);
  }
  for(var d=1;d<=dim;d++){
    (function(day){
      var s=iso(viewY,viewM,day);
      var btn=document.createElement("button");
      btn.type="button"; btn.textContent=day;
      var cls="jcl-day";
      if(s<todayS||s<COVER_START||s>COVER_END){ cls+=" past"; btn.disabled=true; }
      else if(BOOKED[s]){ cls+=" booked"; btn.disabled=true; btn.title="Booked"; }
      else{
        var ec=eligClass(s);
        cls+=" "+ec;
        if(selStart&&s===selStart) cls+=" sel-start";
        if(selEnd&&s===selEnd) cls+=" sel-end";
        if(selStart&&selEnd&&s>selStart&&s<selEnd) cls+=" in-range";
        btn.title = ec==="avail-in" ? "Check-in only"
          : ec==="avail-out" ? "Check-out only"
          : ec==="avail-mid" ? "Open night — mid-stay only"
          : "Available — check-in or check-out";
        var clickable;
        if(!selStart||(selStart&&selEnd)){
          /* picking a check-in: only dates a stay can start on */
          clickable=canCheckIn(s);
          if(!clickable) cls+=" nopick";
        }else if(s===selStart){
          clickable=true; /* tap again to clear */
        }else if(s>selStart){
          /* picking a check-out: only dates that complete a valid stay */
          clickable=validStay(selStart,s);
          if(clickable) btn.title="Tap to check out here";
          else cls+=" nopick dim";
        }else{
          /* earlier date while picking a check-out restarts the selection */
          clickable=canCheckIn(s);
          if(!clickable) cls+=" nopick dim";
        }
        if(clickable){ btn.onclick=function(){onPick(s);}; }
        else{ btn.disabled=true; }
      }
      btn.className=cls; grid.appendChild(btn);
    })(d);
  }
  /* nav bounds: current month .. coverage end month */
  var cS=iso(today.getFullYear(),today.getMonth(),1);
  var vS=iso(viewY,viewM,1);
  var eP=parseISO(COVER_END); var eS=iso(eP.getFullYear(),eP.getMonth(),1);
  document.getElementById("jcl-prev").disabled = (vS<=cS);
  document.getElementById("jcl-next").disabled = (vS>=eS);
  updateBar();
}

/* Transient status-line override (e.g. invalid-range notice); cleared on next pick. */
var statusOverride=null;
function onPick(s){
  statusOverride=null;
  if(!selStart||(selStart&&selEnd)){ selStart=s; selEnd=null; }
  else if(s===selStart){ selStart=null; selEnd=null; }
  else if(s<selStart){ selStart=s; selEnd=null; }
  else if(validStay(selStart,s)){ selEnd=s; }
  else{ selStart=s; selEnd=null; } /* unreachable via clicks; safety net */
  render(); broadcast();
  if(selStart && selEnd){ gadsFireMicro(); }
}

/* Broadcast the current selection to the embedding page (e.g. Wix) so host
   page buttons can pick up the chosen dates. Same-origin policy blocks the
   parent from reading the iframe, so we push via postMessage. */
function broadcast(){
  try{
    window.parent.postMessage({
      type:"vitamin-sea-selection",
      checkin:selStart||null,
      checkout:selEnd||null,
      nights:(selStart&&selEnd)?nightsBetween(selStart,selEnd):0
    },"*");
  }catch(e){}
}

function inquiryHref(){
  if(!INQUIRY||!selStart||!selEnd) return "#";
  var n=nightsBetween(selStart,selEnd);
  var rangeTxt=pretty(selStart)+" → "+pretty(selEnd)+" ("+n+(n===1?" night":" nights")+")";
  if(INQUIRY.type==="email"){
    var subj="Booking inquiry: "+PROPERTY+" ("+rangeTxt+")";
    var body="Hi,%0D%0A%0D%0AI'd like to request a stay at "+encodeURIComponent(PROPERTY)+":"
      +"%0D%0ACheck-in: "+encodeURIComponent(pretty(selStart))
      +"%0D%0ACheck-out: "+encodeURIComponent(pretty(selEnd))
      +"%0D%0ANights: "+n+"%0D%0A%0D%0AThank you!";
    return "mailto:"+INQUIRY.address+"?subject="+encodeURIComponent(subj)+"&body="+body;
  }
  if(INQUIRY.type==="url"){
    return INQUIRY.url.split("{checkin}").join(fmtDate(selStart))
                       .split("{checkout}").join(fmtDate(selEnd))
                       .split("{nights}").join(String(n));
  }
  return "#";
}

/* Date formatting for URL placeholders: default ISO (YYYY-MM-DD);
   "mdy" gives MM/DD/YYYY for booking engines like Island Realty. */
function fmtDate(iso){
  if(INQUIRY && INQUIRY.date_format==="mdy"){
    var p=iso.split("-"); return p[1]+"/"+p[2]+"/"+p[0];
  }
  return iso;
}

/* Google Ads conversion tracking. The primary conversion fires on the
   "Check Rates & Book" click; the date-selection micro-conversion fires
   when a complete date range is picked. Both are inert until config.json
   supplies a google_ads block (conversion_id + labels). */
var _gadsLastMicro = null;
var _gadsNavigated = false;
function gadsNavigateTop(url){
  if(_gadsNavigated) return; _gadsNavigated = true;
  try{ window.top.location.href = url; }catch(e){ window.location.href = url; }
}
/* Click-log attribution fallback: beacon the book click (client timestamp
   + selected dates only -- no PII; the collector stores no IP) to the
   click-log Worker. Inert until config.json supplies a click_log endpoint.
   sendBeacon is used because it survives the top-navigation that follows. */
function clickLogFire(){
  if(!CLICKLOG || !CLICKLOG.endpoint || !selStart || !selEnd) return;
  try{
    var payload = JSON.stringify({
      t: new Date().toISOString(),
      ci: selStart,
      co: selEnd,
      n: nightsBetween(selStart, selEnd)
    });
    if(navigator.sendBeacon){
      navigator.sendBeacon(CLICKLOG.endpoint, new Blob([payload], {type: "text/plain"}));
    }else{
      fetch(CLICKLOG.endpoint, {method: "POST", body: payload, keepalive: true, mode: "no-cors"});
    }
  }catch(e){}
}

function gadsFirePrimary(){
  clickLogFire();
  var url = document.getElementById("jcl-cta").href;
  if(!GADS || !GADS.book_click_label || typeof gtag === "undefined"){
    gadsNavigateTop(url); return;
  }
  _gadsNavigated = false;
  try{
    gtag("event", "conversion", {
      "send_to": GADS.conversion_id + "/" + GADS.book_click_label,
      "event_callback": function(){ gadsNavigateTop(url); }
    });
  }catch(e){ gadsNavigateTop(url); return; }
  /* Mirror the book click into the Meta Pixel as a Lead. */
  fbpTrack("Lead");
  /* Fallback: ad blockers or a slow beacon must not strand the click. */
  setTimeout(function(){ gadsNavigateTop(url); }, 900);
}
function gadsFireMicro(){
  if(!GADS || !GADS.date_select_label || typeof gtag === "undefined") return;
  var key = selStart + "|" + selEnd;
  if(key === _gadsLastMicro) return;
  _gadsLastMicro = key;
  try{
    gtag("event", "conversion", {
      "send_to": GADS.conversion_id + "/" + GADS.date_select_label
    });
  }catch(e){}
  /* Mirror the funnel step into the Meta Pixel (deduped by the key above). */
  fbpTrack("InitiateCheckout");
}

/* Meta Pixel event mirroring. PageView is handled by the Wix-side pixel;
   the iframe only fires funnel events the parent page cannot see. */
function fbpTrack(eventName){
  if(!FBP || !FBP.pixel_id || typeof fbq === "undefined") return;
  try{ fbq("track", eventName); }catch(e){}
}

function updateBar(){
  var bar=document.getElementById("jcl-bar");
  var cta=document.getElementById("jcl-cta");
  var status=document.getElementById("jcl-status");
  if(selStart&&selEnd){
    var n=nightsBetween(selStart,selEnd);
    document.getElementById("jcl-summary").innerHTML=
      "<b>"+pretty(selStart)+"</b> &rarr; <b>"+pretty(selEnd)+"</b> &middot; "+n+(n===1?" night":" nights");
    bar.classList.add("show");
    status.classList.add("hidden");
    if(INQUIRY){ cta.href=inquiryHref(); cta.classList.add("show"); }
    else{ cta.classList.remove("show"); }
  }else{
    bar.classList.remove("show"); cta.classList.remove("show");
    status.classList.remove("hidden");
    status.textContent=statusOverride||(selStart
      ? (satOnly(selStart)
          ? "Summer stays run Saturday to Saturday — tap a Saturday checkout."
          : "Now tap your checkout date ("+minNights()+"-night minimum).")
      : "Tap your dates to check rates and book.");
  }
}

document.getElementById("jcl-prev").onclick=function(){
  viewM--; if(viewM<0){viewM=11;viewY--;} render();
};
document.getElementById("jcl-next").onclick=function(){
  viewM++; if(viewM>11){viewM=0;viewY++;} render();
};
document.getElementById("jcl-cta").onclick=function(e){
  e.preventDefault();
  gadsFirePrimary();
};
document.getElementById("jcl-clear").onclick=function(){
  selStart=selEnd=null; statusOverride=null; render(); broadcast();
};
render();
</script>
